server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: paymentCompletedEvent:com.venuelink.paymentservice.event.PaymentCompletedEvent,paymentFailedEvent:com.venuelink.paymentservice.event.PaymentFailedEvent
